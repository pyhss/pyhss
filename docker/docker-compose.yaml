services:

  pyhss_api:
    image: ghcr.io/pyhss/pyhss/pyhss:development
    build:
      context: ../
      dockerfile: docker/Dockerfile
    env_file:
        - ../docker/.env
    environment:
      CONTAINER_ROLE: "api"
    container_name: "pyhss_api"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pyhss_sqlite:/var/lib/pyhss
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/oam/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    stop_grace_period: 1s
    depends_on:
      pyhss_hss:
        condition: service_started

  pyhss_diameter:
    image: ghcr.io/pyhss/pyhss/pyhss:development
    env_file:
        - ../docker/.env
    environment:
      CONTAINER_ROLE: "diameter"
    container_name: "pyhss_diameter"
    ports:
      - "127.0.0.1:3868:3868"
    volumes:
      - pyhss_sqlite:/var/lib/pyhss
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3868"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    stop_grace_period: 1s
    depends_on:
      pyhss_api:
        condition: service_healthy

  pyhss_hss:
    image: ghcr.io/pyhss/pyhss/pyhss:development
    env_file:
        - ../docker/.env
    environment:
      CONTAINER_ROLE: "hss"
    container_name: "pyhss_hss"
    volumes:
      - pyhss_sqlite:/var/lib/pyhss
    stop_grace_period: 1s
    depends_on:
      redis:
        condition: service_healthy

  pyhss_gsup:
    image: ghcr.io/pyhss/pyhss/pyhss:development
    env_file:
        - ../docker/.env
    container_name: "pyhss_gsup"
    environment:
      CONTAINER_ROLE: "gsup"
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - pyhss_sqlite:/var/lib/pyhss
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    stop_grace_period: 1s
    depends_on:
      pyhss_hss:
        condition: service_started

  # 5G UDR, e.g. for Open5GS in 5G SA: docker compose --profile 5g up
  pyhss_udr:
    image: ghcr.io/nickvsnetworking/pyhss/pyhss:development
    env_file:
        - ../docker/.env
    container_name: "pyhss_udr"
    environment:
      CONTAINER_ROLE: "udr"
    profiles: ["5g"]
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - pyhss_sqlite:/var/lib/pyhss
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7777"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    stop_grace_period: 2s
    depends_on:
      pyhss_hss:
        condition: service_started

  redis:
    image: "redis:7.0-alpine"
    container_name: "redis"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis_data:
  pyhss_sqlite:
